# Abys-Invest — Air en el desplegado: variante con auto-recompilación (M4d).
# Copiada por `deploy/setup.sh --with-air` a /opt/abys-invest/.air.prod.toml.
#
# La unit alterna deploy/abys-invest-api-air.service arranca air con
# WorkingDirectory=/opt/abys-invest/src (fuentes Go copiadas por setup.sh);
# air observa esas fuentes y recompila cmd/api a /opt/abys-invest/bin/api
# (misma ruta del binario del unit estático) al detectar cambios.
#
# Requisitos:
#   - toolchain Go en el servidor. La unit conserva un PATH de systemd que
#     incluye /usr/bin y /usr/local/bin; setup.sh --with-air valida `which go`.
#   - src/ y bin/ escribibles por el usuario del servicio: por eso la unit air
#     usa ProtectSystem=full + ReadWritePaths (no strict como la estática).
#
# Nota v1.67.x (go install @latest):
#   - `build.bin` fue renombrado a `build.entrypoint`.
#   - `misc.clean_on_start` no existe en esta versión; clean_on_exit=false
#     garantiza el objetivo equivalente (NO borrar artefactos del servicio).

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o /opt/abys-invest/bin/api ./cmd/api"
  entrypoint = ["/opt/abys-invest/bin/api"]
  delay = 2000
  exclude_dir = ["web/dist", "tmp", ".git", "node_modules"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  send_interrupt = false
  kill_delay = "0s"
  stop_on_error = false
  rerun = false

[log]
  time = false
  main_only = false

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false
  keep_scroll = true