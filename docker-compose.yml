# Abys-Invest local development database: PostgreSQL 16 + TimescaleDB.
# Usage: docker compose up -d
services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: abys-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abys}
      POSTGRES_DB: ${POSTGRES_DB:-abys}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-abys} -d ${POSTGRES_DB:-abys}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: abys-invest-pgdata